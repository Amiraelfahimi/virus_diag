name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install flake8
      - run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vérifier que le projet s'exécute (entraînement + évaluation)
        run: python main.py train
      - name: Construire le package (zip)
        run: |
          mkdir dist
          zip -r dist/virus_diag.zip . -x ".git/*" ".github/*" "dist/*" "*__pycache__*"
      - uses: actions/upload-artifact@v4
        with:
          name: virus_diag-build
          path: dist/virus_diag.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: virus_diag-build
      - name: Déploiement (simulé)
        run: |
          ls -l virus_diag.zip
          echo "Déploiement de virus_diag.zip réussi"
